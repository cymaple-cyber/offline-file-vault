name: 构建 Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打包 EXE
        run: pyinstaller --windowed --name "离线文件保险箱" --add-data "src;src" main.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: 离线文件保险箱-Windows
          path: dist/离线文件保险箱.exe
